<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Reasonix Terminal</title>
<link rel="stylesheet" href="xterm.css">
<style>
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: #000000;
    overflow: hidden;
  }
  #term {
    padding: 6px;
    height: calc(100% - 12px);
    box-sizing: border-box;
  }
  .xterm { height: 100%; }
  /* 触摸滚动提示条（可选） */
  #scrollbar-hint {
    position: fixed; right: 2px; top: 40%;
    width: 4px; height: 90px;
    background: rgba(88,166,255,0.35);
    border-radius: 2px;
    pointer-events: none;
    z-index: 10;
    display: none;
  }
  /* 悬浮快捷键工具栏：可拖拽定位，终端输入时自动避让 */
  #keys-toolbar {
    position: fixed;
    right: 8px; bottom: 10px;
    z-index: 20;
    display: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #keys-toolbar .kb-bar {
    background: rgba(18,21,26,0.94);
    border: 1px solid #3a3f47;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.55);
    overflow: hidden;
  }
  #keys-toolbar .kb-row { display: flex; }
  #keys-toolbar .kb-key {
    width: 40px; height: 36px;
    margin: 1px;
    border: none; border-radius: 5px;
    background: #1e2228;
    color: #e6edf3;
    font-size: 12px;
    font-family: Menlo, Consolas, monospace;
    cursor: pointer;
    text-align: center;
    line-height: 36px;
    box-sizing: border-box;
  }
  #keys-toolbar .kb-key:active,
  #keys-toolbar .kb-key.kb-pressed {
    background: #2d4a75;
    color: #ffffff;
  }
  #keys-toolbar .kb-handle {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 24px;
    background: #14171c;
    border-top: 1px solid #3a3f47;
    cursor: grab;
    font-size: 10px;
    color: #8a8f98;
    letter-spacing: 1px;
  }
  #keys-toolbar .kb-handle:active { cursor: grabbing; }
  #keys-toolbar .kb-close {
    position: absolute;
    top: -9px; right: -9px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #262b33;
    border: 1px solid #4a4f58;
    color: #b3b8c0;
    font-size: 12px;
    line-height: 18px;
    text-align: center;
    cursor: pointer;
    z-index: 3;
  }
  #keys-toolbar .kb-close:active { background: #3d434d; }
</style>
</head>
<body>
<div id="term"></div>
<div id="scrollbar-hint"></div>
<!-- 悬浮快捷键工具栏：可拖拽定位，终端输入时自动避让 -->
<div id="keys-toolbar">
  <div class="kb-close" title="隐藏工具栏">&#10005;</div>
  <div class="kb-bar">
    <div class="kb-row">
      <span class="kb-key" data-seq="&#27;[A">&#8593;</span>
      <span class="kb-key" data-seq="&#27;[5~">PgUp</span>
      <span class="kb-key" data-seq="&#27;[B">&#8595;</span>
    </div>
    <div class="kb-row">
      <span class="kb-key" data-seq="&#27;[6~">PgDn</span>
      <span class="kb-key" data-seq="&#27;">Esc</span>
      <span class="kb-key" data-seq="&#9;">Tab</span>
    </div>
    <div class="kb-row">
      <span class="kb-key" data-seq="&#3;">Ctrl+C</span>
      <span class="kb-key" data-seq="&#13;">Enter</span>
      <span class="kb-key" data-seq="&#27;[Z">Shift+Tab</span>
    </div>
    <div class="kb-handle">&#10271; 拖动</div>
  </div>
</div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script>
  var term = new Terminal({
    convertEol: true,
    cursorBlink: true,
    fontSize: 13,
    fontFamily: 'Menlo, Consolas, "DejaVu Sans Mono", monospace',
    theme: {
      background: '#000000',
      foreground: '#e6edf3',
      cursor: '#58a6ff',
      selectionBackground: '#264f78'
    },
    scrollback: 8000
  });
  var fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById('term'));
  // 注意：不自动 focus()——聚焦 xterm textarea 会弹出软键盘，压缩终端高度
  // 导致 reasonix 按错误行数渲染（显示不全）。用户点击终端输入时自然聚焦。

  // Java -> JS：追加进程输出
  window.onTermData = function (d) {
    if (d && d.length) term.write(d);
  };

  // JS -> Java：键盘输入
  term.onData(function (d) {
    if (window.Android && window.Android.write) {
      try { Android.write(d); } catch (e) {}
    }
  });

  // 终端尺寸变化 -> 同步 PTY 窗口大小（TUI 布局依赖）
  term.onResize(function (dims) {
    if (window.Android && window.Android.resize) {
      try { Android.resize(dims.rows, dims.cols); } catch (e) {}
    }
  });

  // 屏幕自适应：让终端填满视口，并按视口计算行列
  function doFit() {
    try { fitAddon.fit(); } catch (e) {}
    // 强制刷新渲染：避免 WebView 启动时 xterm 未完整绘制（需点击才显示 CLI）
    try { term.refresh(0, term.rows - 1); } catch (e) {}
    if (window.Android && window.Android.reportState) {
      try {
        Android.reportState(JSON.stringify({
          cols: term.cols, rows: term.rows,
          viewportY: term.buffer.active.viewportY,
          length: term.buffer.active.length
        }));
      } catch (e) {}
    }
  }
  window.addEventListener('resize', doFit);
  window.addEventListener('orientationchange', function () { setTimeout(doFit, 300); });
  // 字体/布局就绪后再 fit 几次，确保尺寸准确
  setTimeout(doFit, 100);
  setTimeout(doFit, 400);
  setTimeout(doFit, 1200);
  // 启动后强制刷新渲染（多时机，避免"点击才显示"）
  setTimeout(function () { try { term.refresh(0, term.rows - 1); } catch (e) {} }, 300);
  setTimeout(function () { try { term.refresh(0, term.rows - 1); } catch (e) {} }, 800);
  setTimeout(function () { try { term.refresh(0, term.rows - 1); } catch (e) {} }, 2000);
  // 延迟聚焦输入框（启动即就绪，无需点击）：聚焦触发 reasonix 按键盘调整后
  // 的尺寸（rows 40->26）重新渲染完整 CLI 界面，且软键盘自动弹出可直接输入。
  setTimeout(function () { try { term.focus(); } catch (e) {} }, 1200);
  // 启动后强制重排渲染：WebView 合成层可能未绘制完整终端（点击才显示），
  // 微调容器尺寸触发 reflow + 重新 fit，让 reasonix 输出完整显示。
  setTimeout(function () {
    var t = document.getElementById('term');
    if (t) {
      var h = t.offsetHeight;
      t.style.height = (h > 10 ? h - 2 : h) + 'px';
      setTimeout(function () {
        t.style.height = '';
        try { fitAddon.fit(); } catch (e) {}
        try { term.refresh(0, term.rows - 1); } catch (e) {}
      }, 80);
    }
  }, 700);

  // ---- 触摸滚动：浏览对话历史 ----
  // reasonix 的对话历史由 ↑/↓ 驱动（官方滚轮在 DECSET 1007 下映射为 ↑/↓）。
  // 因此触摸滑动发送 ↑/↓ 序列（ESC[A / ESC[B）——手指上滑=↑（看更早历史），
  // 下滑=↓（回看新内容），与滚轮语义完全一致，reasonix 无论 TUI（alt screen）
  // 还是恢复会话（普通屏）都原生响应，不再依赖翻页键。
  //
  // 滑动调速：SCROLL_STEP 表示"每翻动一行历史所需的滑动像素数"（由 Java 侧滑
  // 菜单 SeekBar 注入，档位 1(慢)~10(快)，默认 5 → 约 100px/行）。值越大滑动
  // 越慢（每行所需像素越多）；值越小越快。
  var SCROLL_STEP = 100;
  function setScrollStep(v) {
    if (typeof v === 'number' && v >= 1) SCROLL_STEP = v;
  }
  function sendArrowKey(dy) {
    if (!(window.Android && window.Android.write)) return;
    var acc = 0;
    // 手指上滑（dy<0，clientY 减小）= 看更早历史 → ↑；下滑（dy>0）= 回看新内容 → ↓
    if (dy < 0) acc = -dy; else acc = dy;
    // 整页换算：滑动 SCROLL_STEP × 当前 rows 像素 = 翻一页（默认 100px/行 × 26 行 ≈
    // 2600px/页）。手指滑满一页就发一组方向键（rows 次 ↑ 或 ↓），reasonix TUI 一次
    // 翻一屏历史——避免逐行 100px/行导致翻一整屏要滑 2600px（手滑不到，"滑不动"）。
    // 正常小幅滑动（100~300px）产生 1~3 行即时反馈，不会"滑了没反应"。
    var pageStep = SCROLL_STEP * term.rows;
    var pages = 0;
    while (acc >= pageStep) {
      pages++;
      acc -= pageStep;
    }
    if (pages > 0) {
      var key = dy < 0 ? '[A' : '[B';
      var i, j;
      for (i = 0; i < pages; i++) {
        for (j = 0; j < term.rows; j++) {
          try { Android.write(key); } catch (err) {}
        }
      }
    }
    // 余量折算：不足一页的像素按单行像素换算成行数发送（单行 = SCROLL_STEP px），
    // 保证 100~300px 小幅滑动即时翻 1~3 行，修复"滑了没反应"。
    var rowLines = Math.floor(acc / SCROLL_STEP);
    if (rowLines > term.rows) rowLines = term.rows;   // 封顶：单次滑动最多翻一屏
    if (rowLines > 0) {
      var k2 = dy < 0 ? '[A' : '[B';
      for (i = 0; i < rowLines; i++) {
        try { Android.write(k2); } catch (err) {}
      }
    }
  }
  var touchStartY = null;
  var touchMoved = false;
  var wheelSent = false;
  var multiTouchStart = false;   // 双指按下标记：双指轻点 = Esc（中止/关闭）
  var termEl = document.getElementById('term');
  termEl.addEventListener('touchstart', function (e) {
    touchStartY = e.touches[0].clientY;
    touchMoved = false;
    wheelSent = false;   // 每次触摸重置，确保滚动模式通知每次都上报
    multiTouchStart = e.touches.length >= 2;
  }, { passive: true });
  termEl.addEventListener('touchmove', function (e) {
    if (touchStartY === null) return;
    if (multiTouchStart) {
      // 双指已移动：视为有手势移动（非轻点），但不发单指滚动键
      touchMoved = true;
      return;
    }
    var dy = e.touches[0].clientY - touchStartY;
    touchStartY = e.touches[0].clientY;
    if (Math.abs(dy) < 6) return;
    touchMoved = true;
    var inAlt = term.buffer.active.type === 'alternate';
    if (inAlt) {
      // reasonix TUI（alt screen）：↑/↓ 滚动对话历史
      sendArrowKey(dy);
    } else {
      // 普通 screen：可能是 shell（滚动 xterm scrollback 浏览历史输出），
      // 也可能是 reasonix 恢复会话界面（渲染历史到普通屏）——
      // 两者都做：滚 xterm scrollback + 发翻页键（shell 会忽略翻页键，无害）。
      // scrollLines 的行数按 SCROLL_STEP 缩放，保持与 TUI 翻页速度一致。
      var lines = Math.max(1, Math.round(Math.abs(dy) / SCROLL_STEP));
      if (dy < 0) {
        term.scrollLines(-lines);   // 手指上滑：向上滚 scrollback 看更早输出
      } else {
        term.scrollLines(lines);    // 手指下滑：向下滚
      }
      // 普通屏：发 PgUp/PgDn 翻页键（shell 会忽略翻页键，无害），
      // 不发 ↑/↓——↑/↓ 会触发 shell 命令历史导航，干扰输入。
      var pgKey = dy < 0 ? '[5~' : '[6~';
      // 翻页键也按滑动像素折算行数发送（单行 = SCROLL_STEP px），
      // 保证普通屏（恢复会话）小幅滑动也有即时反馈。
      var pgLines = Math.round(Math.abs(dy) / SCROLL_STEP);
      if (pgLines > term.rows) pgLines = term.rows;   // 封顶：单次滑动最多翻一屏
      if (pgLines < 1) pgLines = 1;
      if (window.Android && window.Android.write) {
        for (var pi = 0; pi < pgLines; pi++) {
          try { Android.write(pgKey); } catch (err) {}
        }
      }
    }
    if (!wheelSent) {
      wheelSent = true;
      if (window.Android && window.Android.reportState) {
        try { Android.reportState('wheel-mode'); } catch (err) {}
      }
    }
  }, { passive: true });
  termEl.addEventListener('touchend', function () {
    touchStartY = null;
    // 双指轻点（未移动）：发送 Esc——中止当前回合/关闭弹窗/退出编辑，不弹软键盘。
    if (multiTouchStart && !touchMoved) {
      if (window.Android && window.Android.write) {
        try { Android.write('\u001b'); } catch (e) {}
      }
      multiTouchStart = false;
      touchMoved = false;
      return;
    }
    multiTouchStart = false;
    // 轻点（未滑动）时聚焦并回到底部
    if (!touchMoved) {
      term.focus();
      term.scrollToBottom();
    } else if (window.Android && window.Android.reportState) {
      try {
        Android.reportState(JSON.stringify({
          cols: term.cols, rows: term.rows,
          viewportY: term.buffer.active.viewportY,
          length: term.buffer.active.length
        }));
      } catch (e) {}
    }
    touchMoved = false;
  }, { passive: true });

  // ---- 悬浮快捷键工具栏（可拖拽） ----
  // 九键快捷（↑ PgUp ↓ / PgDn Esc Tab / Ctrl+C Enter Shift+Tab），直接写入终端
  // 通道（不追加换行）。拖拽把手（⠿ 拖动）可在屏幕内任意定位；
  // 右上角 ✕ 隐藏，隐藏后从侧滑菜单「快捷键」可再次调出。
  var kbToolbar = document.getElementById('keys-toolbar');
  var kbTimer = null;
  function kbSend(seq) {
    if (seq && window.Android && window.Android.write) {
      try { Android.write(seq); } catch (err) {}
    }
  }
  // 暴露给 Java 侧滑菜单：window.showKeysToolbar() / window.hideKeysToolbar()
  window.showKeysToolbar = function () {
    if (kbToolbar) kbToolbar.style.display = 'block';
  };
  window.hideKeysToolbar = function () {
    if (kbToolbar) kbToolbar.style.display = 'none';
  };
  // 长按连发（Esc 单次语义，不连发；其余 150ms 连发一屏/滚动）
  var kbLongSeq = { 'Esc': null, 'Ctrl+C': null };
  if (kbToolbar) {
    kbToolbar.addEventListener('touchstart', function (e) {
      var k = e.target;
      if (!k || !k.classList || !k.classList.contains('kb-key')) return;
      e.preventDefault();
      kbSend((k.getAttribute('data-seq') || '').replace(/&amp;/g, '&')
        .replace(/&#(\d+);/g, function (m, n) { return String.fromCharCode(parseInt(n, 10)); }));
      if (kbLongSeq[k.textContent.trim()] !== undefined) return;  // 单次键不连发
      kbTimer = setInterval(function () {
        kbSend((k.getAttribute('data-seq') || '').replace(/&amp;/g, '&')
          .replace(/&#(\d+);/g, function (m, n) { return String.fromCharCode(parseInt(n, 10)); }));
      }, 150);
    }, { passive: false });
    kbToolbar.addEventListener('touchend', function () {
      if (kbTimer) { clearInterval(kbTimer); kbTimer = null; }
    });
    kbToolbar.addEventListener('touchcancel', function () {
      if (kbTimer) { clearInterval(kbTimer); kbTimer = null; }
    });
    // 关闭按钮
    kbToolbar.querySelector('.kb-close').addEventListener('click', function () {
      kbToolbar.style.display = 'none';
    });
    // 拖拽定位（单指拖动把手/工具条）
    var kbDrag = null;
    function kbDragStart(e, t) {
      var touch = e.touches ? e.touches[0] : e;
      kbDrag = {
        sx: touch.clientX, sy: touch.clientY,
        ox: kbToolbar.offsetLeft, oy: kbToolbar.offsetTop,
        target: t
      };
      e.preventDefault();
      try { e.stopPropagation(); } catch (err) {}
    }
    kbToolbar.addEventListener('touchstart', function (e) {
      var h = e.target;
      if (!h || !h.classList) return;
      // 把手或工具条本体可拖动（按键区域除外）
      if (h.classList.contains('kb-handle') || h.classList.contains('kb-bar')
          || h.classList.contains('kb-row') || h.classList.contains('kb-close')
          || h === kbToolbar) {
        kbDragStart(e, h);
      }
    }, { passive: false });
    kbToolbar.addEventListener('touchmove', function (e) {
      if (!kbDrag) return;
      var t = e.touches ? e.touches[0] : e;
      var nx = kbDrag.ox + (t.clientX - kbDrag.sx);
      var ny = kbDrag.oy + (t.clientY - kbDrag.sy);
      var bw = kbToolbar.offsetWidth, bh = kbToolbar.offsetHeight;
      nx = Math.max(2, Math.min(window.innerWidth - bw - 2, nx));
      ny = Math.max(2, Math.min(window.innerHeight - bh - 2, ny));
      kbToolbar.style.left = nx + 'px';
      kbToolbar.style.top = ny + 'px';
      kbToolbar.style.right = 'auto';
      kbToolbar.style.bottom = 'auto';
      e.preventDefault();
    }, { passive: false });
    function kbDragEnd() { kbDrag = null; }
    kbToolbar.addEventListener('touchend', kbDragEnd);
    kbToolbar.addEventListener('touchcancel', kbDragEnd);
  }

  // 通知 Java 终端已就绪
  if (window.Android && window.Android.onReady) {
    try { Android.onReady(); } catch (e) {}
  }
</script>
</body>
</html>
