plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rxproot.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.rxproot.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 用 debug keystore 签名 release（个人分发，无需正式证书）
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    // DrawerLayout 自带传递依赖 androidx.core（1.2.0），足够满足 GravityCompat 使用，
    // 无需显式引入大体积的 core 1.13.1（会带入 lifecycle/concurrent 等大量多余代码）。
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
}
