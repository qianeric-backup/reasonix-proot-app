plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rsxm.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.rsxm.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 用 debug keystore 签名 release（个人分发，无需正式证书）
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    androidResources {
        // proot/loader 以不压缩（stored）方式打包：部分厂商安装器（vivo/iQOO 流式安装）
        // 对 deflate 压缩的 native lib 解压失败导致 lib 缺失，stored 直接落盘无需解压
        noCompress += ["proot.so", "loader.so"]
    }
}

dependencies {
    // DrawerLayout（侧滑菜单）
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    // 不引入 Material Components 库（体积大）：使用平台原生 android:Theme.Material
    // 主题 + 原生控件，即可获得安卓原生 Material 风格，保持应用轻量化。
}
